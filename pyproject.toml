[tool.poetry]
name = "hro-operations"
version = "0.1.0"
description = "開催日の前向きペーパー/実運用オーケストレーション。各サーバーで起動する常駐/実行スクリプト群。"
authors = ["hro"]
readme = "README.md"
packages = [{ include = "hro_operations" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# DB接続の実依存。agent(ops_jobキュー)/day-runner とも常時使うため必須。
psycopg = { version = ">=3.1", extras = ["binary"] }
# 購入・最適化スタック(run-day/list/once で使用)。agent(sync/odds)には不要なので任意 extra。
# VM(day-runner/決済/成品化)は `poetry install -E betting`。
# Windows(sync/odds の agent のみ)は `poetry install`(素)= 軽量構成。
hro-backtest = { path = "../hro-backtest", develop = true, optional = true }
hro-buyer = { path = "../hro-buyer", develop = true, optional = true }

[tool.poetry.extras]
betting = ["hro-backtest", "hro-buyer"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
hro-ops = "hro_operations.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
